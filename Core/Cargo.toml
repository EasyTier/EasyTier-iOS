[package]
name = "easytier-ios"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.release]
strip = "none"

[dependencies]
easytier = { git = "https://github.com/EasyTier/EasyTier.git", tag = "v2.6.4", version = "=2.6.4", features = ["macos-ne"] }

async-trait = "0.1"
once_cell = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-oslog = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = "1"
