name: Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  SCHEME: EasyTier
  BUILD_CONFIGURATION: Release
  IPA_NAME: EasyTier-nightly-trollstore.ipa

jobs:
  build-and-release:
    name: Build and publish TrollStore IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode and install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "ARCHIVE_PATH=${RUNNER_TEMP}/EasyTier.xcarchive" >> "${GITHUB_ENV}"
          echo "PACKAGE_PATH=${RUNNER_TEMP}/package" >> "${GITHUB_ENV}"
          echo "EXPORT_PATH=${RUNNER_TEMP}/export" >> "${GITHUB_ENV}"

          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

          rustup target add aarch64-apple-ios
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi

          rustc --version
          protoc --version

      - name: Archive unsigned Release build
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project EasyTier.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Ad-hoc sign app for TrollStore
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${ARCHIVE_PATH}/Products/Applications/EasyTier.app"
          TUNNEL_PATH="${APP_PATH}/PlugIns/EasyTierNetworkExtension.appex"
          WIDGET_PATH="${APP_PATH}/PlugIns/EasyTierWidgetExtension.appex"

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements EasyTierWidgetExtension/EasyTierWidgetExtension.entitlements \
            "${WIDGET_PATH}"
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements EasyTierNetworkExtension/EasyTierNetworkExtension.entitlements \
            "${TUNNEL_PATH}"
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements EasyTier/EasyTier.entitlements \
            "${APP_PATH}"

      - name: Verify signatures and entitlements
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${ARCHIVE_PATH}/Products/Applications/EasyTier.app"
          TUNNEL_PATH="${APP_PATH}/PlugIns/EasyTierNetworkExtension.appex"
          WIDGET_PATH="${APP_PATH}/PlugIns/EasyTierWidgetExtension.appex"

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

          assert_entitlement() {
            local bundle_path="$1"
            local entitlement_key="$2"
            local expected_value="$3"
            local output_path="$4"
            local actual_value

            codesign --display --entitlements :- "${bundle_path}" \
              > "${output_path}" 2>/dev/null
            actual_value="$(
              /usr/libexec/PlistBuddy \
                -c "Print :${entitlement_key}:0" \
                "${output_path}"
            )"

            if [[ "${actual_value}" != "${expected_value}" ]]; then
              echo "::error::Unexpected ${entitlement_key} in ${bundle_path}: ${actual_value}"
              exit 1
            fi
          }

          assert_entitlement \
            "${APP_PATH}" \
            "com.apple.developer.networking.networkextension" \
            "packet-tunnel-provider" \
            "${RUNNER_TEMP}/app-network-extension-entitlements.plist"
          assert_entitlement \
            "${APP_PATH}" \
            "com.apple.security.application-groups" \
            "group.cn.easytier" \
            "${RUNNER_TEMP}/app-group-entitlements.plist"
          assert_entitlement \
            "${APP_PATH}" \
            "com.apple.developer.icloud-container-identifiers" \
            "iCloud.cn.easytier" \
            "${RUNNER_TEMP}/app-icloud-entitlements.plist"
          assert_entitlement \
            "${TUNNEL_PATH}" \
            "com.apple.developer.networking.networkextension" \
            "packet-tunnel-provider" \
            "${RUNNER_TEMP}/tunnel-network-extension-entitlements.plist"
          assert_entitlement \
            "${TUNNEL_PATH}" \
            "com.apple.security.application-groups" \
            "group.cn.easytier" \
            "${RUNNER_TEMP}/tunnel-group-entitlements.plist"
          assert_entitlement \
            "${WIDGET_PATH}" \
            "com.apple.developer.networking.networkextension" \
            "packet-tunnel-provider" \
            "${RUNNER_TEMP}/widget-network-extension-entitlements.plist"
          assert_entitlement \
            "${WIDGET_PATH}" \
            "com.apple.security.application-groups" \
            "group.cn.easytier" \
            "${RUNNER_TEMP}/widget-group-entitlements.plist"

      - name: Package TrollStore IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${ARCHIVE_PATH}/Products/Applications/EasyTier.app"
          mkdir -p "${PACKAGE_PATH}/Payload" "${EXPORT_PATH}"
          cp -R "${APP_PATH}" "${PACKAGE_PATH}/Payload/EasyTier.app"

          (
            cd "${PACKAGE_PATH}"
            /usr/bin/zip -qry "${EXPORT_PATH}/${IPA_NAME}" Payload
          )

      - name: Verify packaged IPA
        shell: bash
        run: |
          set -euo pipefail

          VERIFY_PATH="${RUNNER_TEMP}/verify-ipa"
          unzip -q "${EXPORT_PATH}/${IPA_NAME}" -d "${VERIFY_PATH}"

          APP_PATH="${VERIFY_PATH}/Payload/EasyTier.app"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

          for executable_path in \
            "${APP_PATH}/EasyTier" \
            "${APP_PATH}/PlugIns/EasyTierNetworkExtension.appex/EasyTierNetworkExtension" \
            "${APP_PATH}/PlugIns/EasyTierWidgetExtension.appex/EasyTierWidgetExtension"
          do
            if [[ ! -x "${executable_path}" ]]; then
              echo "::error::Packaged executable is not executable: ${executable_path}"
              exit 1
            fi
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EasyTier-nightly-trollstore-${{ github.run_number }}
          path: ${{ runner.temp }}/export/EasyTier-nightly-trollstore.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Update rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_NOTES="${RUNNER_TEMP}/nightly-release-notes.md"

          {
            echo "Automated Release build from [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "- Build configuration: \`${BUILD_CONFIGURATION}\`"
            echo "- Code signing: ad-hoc with the app's Network Extension and App Group entitlements"
            echo "- Built: ${BUILD_TIME}"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "> This credentials-free IPA is prepared for TrollStore. Normal iOS installation still requires signing with an Apple provisioning profile."
          } > "${RELEASE_NOTES}"

          git tag --force nightly "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --target "${GITHUB_SHA}" \
              --title "EasyTier Nightly (${SHORT_SHA})" \
              --notes-file "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false
            gh release upload nightly \
              "${EXPORT_PATH}/${IPA_NAME}" \
              --clobber
            gh release delete-asset nightly \
              EasyTier-nightly-unsigned.ipa \
              --yes 2>/dev/null || true
            gh release delete-asset nightly \
              EasyTier-nightly-unsigned.ipa.sha256 \
              --yes 2>/dev/null || true
          else
            gh release create nightly \
              "${EXPORT_PATH}/${IPA_NAME}" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "EasyTier Nightly (${SHORT_SHA})" \
              --notes-file "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false
          fi
